<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="32" y="16" width="712" height="744" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="44" y="26" text-anchor="start" dominant-baseline="hanging" font-family="Times New Roman" font-size="14" fill="#1E293B" font-weight="700">Configuration / Master Data</text>
<rect x="832" y="24" width="416" height="520" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="844" y="34" text-anchor="start" dominant-baseline="hanging" font-family="Times New Roman" font-size="14" fill="#1E293B" font-weight="700">Per-SKU Strategy (transactional)</text>
<rect x="28" y="64" width="300" height="110" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="178" y="119" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Cost Type  «master»
──────────────
cost_type_name (PK)
calculation_type  [Absolute|Relative|VAT]
is_purchase_cost  (deprecate → derivable)</text>
<rect x="28" y="254" width="300" height="150" rx="20" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="178" y="329" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Cost Sub Type «master»
sub_type_name (PK)
cost_type → Cost Type
value_origin [Static|Resolved] ◆NEW
static_value (if Static) ◆NEW
default_source → Cost Source ◆NEW
removed: default_value</text>
<path d="M 408 454 L 688 454 L 688 535 Q 618 553 548 535 Q 478 517 408 535 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="548" y="499" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Allowed Sources  «child of Cost Sub Type»   ◆NEW
──────────────
cost_source → Cost Source</text>
<rect x="28" y="584" width="300" height="130" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="178" y="649" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Cost Source  «master»   ◆NEW
──────────────
source_name (PK)
resolver_key  (dotted path / dispatch)
is_manual  (never auto-overwritten)
is_static  (constant resolver)</text>
<text x="410" y="608" text-anchor="start" dominant-baseline="hanging" font-family="Times New Roman" font-size="13" fill="#1E293B">LEGEND
Green box = NEW doctype/field
Amber box = CHANGED
Dashed → = constrained link
(source ⊆ allowed_sources)</text>
<rect x="48" y="66" width="320" height="120" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="208" y="126" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Amazon Product Strategy
──────────────
proxy_sku → Proxy SKU
min_margin / max_margin
calculated_min_price / max_price (RO)</text>
<path d="M 28 336 L 388 336 L 388 480 Q 298 512 208 480 Q 118 448 28 480 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="208" y="416" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman" font-size="13" fill="#1E293B">Amazon Product Cost «child»
cost_type → Cost Type
cost_sub_type → Cost Sub Type
source → Cost Source (filtered) ◆CHG
value (read-only if Resolved) ◆CHG
rank / is_active (lowest wins)</text>
